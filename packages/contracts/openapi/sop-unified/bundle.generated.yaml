          type: string
          format: date-time
          maxLength: 35
        expiresAt:
          type: string
          format: date-time
          maxLength: 35
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          maxLength: 35
        stewardPrincipalId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: 初次授予原因，不可改写；后续请求原因写 lastChangeReason 并随版本追加历史。
          pattern: \S
        mayRedelegate:
          type: boolean
          enum:
            - false
        lastChangeReason:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
          pattern: \S
          description: 版本1为null；后续版本为该次撤权或接管请求的reason，旧版本在grant_history中保留。
      if:
        properties:
          version:
            const: 1
        required:
          - version
      then:
        properties:
          lastChangeReason:
            type: "null"
      else:
        properties:
          lastChangeReason:
            type: string
