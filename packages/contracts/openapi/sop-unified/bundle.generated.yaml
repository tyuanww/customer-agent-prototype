    IntakeQualityAttribution:
      type: object
      additionalProperties: false
      required:
        - principalId
        - factsVersion
        - recordedAt
      properties:
        principalId:
          $ref: "#/components/schemas/IntakeId"
        factsVersion:
          $ref: "#/components/schemas/IntakeVersion"
        recordedAt:
          type: string
          format: date-time
          maxLength: 35
    IntakeQualityCheck:
      type: object
      additionalProperties: false
      required:
        - scriptId
        - contentHash
        - defect
        - reason
      properties:
        scriptId:
          type: string
          pattern: ^intake_[0-9a-f]{64}$
          minLength: 71
          maxLength: 71
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        defect:
          type: boolean
        reason:
          type: string
          maxLength: 1000
          pattern: ^[^\u0000\uD800-\uDFFF]*$
      if:
        properties:
          defect:
            const: true
      then:
        properties:
          reason:
            type: string
            pattern: \S
      description: 原因按 Unicode code point 计数；禁止 NUL 和未配对代理项。缺陷必须有非空白原因；单轮和请求还受字节预算约束。
    IntakeQualityCommand:
      type: object
      additionalProperties: false
      required:
        - operationId
        - key
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
    IntakeQualityPlan:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - ordinaryCount
        - mandatoryCount
        - withdrawalCount
        - initialTarget
        - expandedTarget
        - initialCount
        - expandedCount
        - seedHash
        - populationManifestHash
        - selectionManifestHash
      properties:
        policyVersion:
          type: string
          const: intake-quality-v1
        ordinaryCount:
          type: integer
          minimum: 0
          maximum: 5000
        mandatoryCount:
          type: integer
          minimum: 0
          maximum: 5000
        withdrawalCount:
          type: integer
          minimum: 0
          maximum: 5000
        initialTarget:
          type: integer
          minimum: 0
          maximum: 5000
        expandedTarget:
          type: integer
          minimum: 0
          maximum: 5000
        initialCount:
          type: integer
          minimum: 0
          maximum: 5000
        expandedCount:
          type: integer
          minimum: 0
          maximum: 5000
        seedHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        populationManifestHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        selectionManifestHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        sopPlan:
          $ref: "#/components/schemas/IntakeSopSopQualityPlan"
      description: SOP requires a bounded sopPlan bound to materialDigest and the exact target set digest; graph targets are read through quality samples. FAQ plans omit sopPlan.
    IntakeSopSopQualityPlan:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - materialDigest
        - targetCount
        - targetsDigest
      properties:
        policyVersion:
          const: sop-task-graph-quality-v2
        materialDigest:
          $ref: "#/components/schemas/IntakeSopHash"
        targetCount:
          type: integer
          minimum: 0
          maximum: 100
        targetsDigest:
          $ref: "#/components/schemas/IntakeSopHash"
    IntakeQualityReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - action
        - key
        - state
        - phase
        - canonicalEncodingVersion
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        action:
          type: string
          enum:
            - quality-freeze
            - quality-check
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        state:
          type: string
          enum:
            - initial_required
            - expansion_required
            - passed
            - revision_required
            - blocked
        phase:
          oneOf:
            - type: string
              enum:
                - initial
                - expanded
            - type: "null"
        sopPlan:
          $ref: "#/components/schemas/IntakeSopSopQualityPlan"
        canonicalEncodingVersion:
          enum:
            - candidate-p1.1
            - candidate-sop-task-graph-v2
          description: 服务端从相同候选 key 对应的材料取得，不由调用方选择。
      if:
        properties:
          action:
            const: quality-freeze
      then:
        properties:
          phase:
            type: "null"
      else:
        properties:
          phase:
            type: string
            enum:
              - initial
              - expanded
          state:
            type: string
            enum:
              - expansion_required
              - passed
              - revision_required
              - blocked
      description: 永久操作的精简历史结果，不含正文、逐条原因、权限或新的使用资格。只有当前有效会话的原主体能恢复；不将历史 state 当成当前状态。 SOP freeze/check receipts include the exact frozen sopPlan; this historical result confers no current authority.
      allOf:
        - if:
            properties:
              phase:
                const: expanded
          then:
            properties:
              state:
                type: string
                enum:
                  - passed
                  - revision_required
                  - blocked
        - if:
            required:
              - canonicalEncodingVersion
            properties:
              canonicalEncodingVersion:
                const: candidate-sop-task-graph-v2
          then:
            properties:
              sopPlan: {}
            required:
              - sopPlan
          else:
            not:
              properties:
                sopPlan: {}
              required:
                - sopPlan
    IntakeQualityRound:
      type: object
      additionalProperties: false
      required:
        - phase
        - reviewer
        - checkedCount
        - defectCount
      properties:
        phase:
          type: string
          enum:
            - initial
            - expanded
        reviewer:
          $ref: "#/components/schemas/IntakeQualityAttribution"
        checkedCount:
          type: integer
          minimum: 0
          maximum: 5000
        defectCount:
          type: integer
          minimum: 0
          maximum: 5000
        sopChecksSummary:
          $ref: "#/components/schemas/IntakeSopSopQualityCheckSummary"
      description: SOP rounds carry bounded summaries; exact graph checks and reasons are read through the same quality samples cursor.
    IntakeSopSopQualityCheckSummary:
      type: object
      additionalProperties: false
      required:
        - checkedCount
        - defectCount
        - checksDigest
      properties:
        checkedCount:
          type: integer
          minimum: 0
          maximum: 100
        defectCount:
          type: integer
          minimum: 0
          maximum: 100
        checksDigest:
          $ref: "#/components/schemas/IntakeSopHash"
    IntakeQualitySample:
      type: object
      additionalProperties: false
      required:
        - scriptId
        - contentHash
        - mandatory
        - entry
        - check
      properties:
        scriptId:
          type: string
          pattern: ^intake_[0-9a-f]{64}$
          minLength: 71
          maxLength: 71
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        mandatory:
          type: boolean
        entry:
          allOf:
            - $ref: "#/components/schemas/IntakeEntry"
            - type: object
              properties:
                operation:
                  const: upsert
        check:
          oneOf:
            - $ref: "#/components/schemas/IntakeQualityCheck"
            - type: "null"
    IntakeQualitySamplePage:
      type: object
      additionalProperties: false
      required:
        - key
        - viewHash
        - phase
        - selectionManifestHash
        - items
        - nextCursor
        - canonicalEncodingVersion
      properties:
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        viewHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        phase:
          type: string
          enum:
            - initial
            - expanded
        selectionManifestHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntakeQualitySample"
          minItems: 0
          maxItems: 100
        nextCursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
        canonicalEncodingVersion:
          enum:
            - candidate-p1.1
            - candidate-sop-task-graph-v2
          description: 服务端从相同候选 key 对应的材料取得，不由调用方选择。
        sopItems:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/IntakeSopSopQualitySample"
      description: v9 按同一 quality viewHash、phase 和游标分页 FAQ 样本及 SOP 图检查；允许仅含图的非空页。完整记录不拆分，整页 UTF-8 JSON 不超过 1 MiB。
      if:
        properties:
          nextCursor:
            type: string
      then:
        anyOf:
          - properties:
              items:
                minItems: 1
          - required:
              - sopItems
            properties:
              sopItems:
                minItems: 1
      allOf:
        - if:
            required:
              - canonicalEncodingVersion
            properties:
              canonicalEncodingVersion:
                const: candidate-sop-task-graph-v2
          then:
            properties:
              sopItems: {}
            required:
              - sopItems
          else:
            properties:
              sopItems:
                maxItems: 0
    IntakeSopSopQualitySample:
      type: object
      additionalProperties: false
      required:
        - target
        - check
      properties:
        target:
          $ref: "#/components/schemas/IntakeSopSopQualityTarget"
        check:
          anyOf:
            - $ref: "#/components/schemas/IntakeSopFlowCheck"
            - type: "null"
    IntakeSopSopQualityTarget:
      type: object
      additionalProperties: false
      required:
        - key
        - graphDigest
      properties:
        key:
          $ref: "#/components/schemas/IntakeSopFlowKey"
        graphDigest:
          $ref: "#/components/schemas/IntakeSopHash"
    IntakeSopFlowCheck:
      type: object
      additionalProperties: false
      required:
        - key
        - graphDigest
        - defect
        - reason
      properties:
        key:
          $ref: "#/components/schemas/IntakeSopFlowKey"
        graphDigest:
          $ref: "#/components/schemas/IntakeSopHash"
        defect:
          type: boolean
        reason:
          type: string
          maxLength: 2000
      if:
        properties:
          defect:
            const: true
        required:
          - defect
      then:
        properties:
          reason:
            type: string
            minLength: 1
            pattern: \S
    IntakeQualityStatus:
      type: object
      additionalProperties: false
      required:
        - key
        - viewHash
        - state
        - plan
        - frozen
        - rounds
        - canonicalEncodingVersion
      properties:
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        viewHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        state:
          type: string
          enum:
            - not_frozen
            - initial_required
            - expansion_required
            - passed
            - revision_required
            - blocked
        plan:
          $ref: "#/components/schemas/IntakeQualityPlan"
        frozen:
          oneOf:
            - $ref: "#/components/schemas/IntakeQualityAttribution"
            - type: "null"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/IntakeQualityRound"
          minItems: 0
          maxItems: 2
          allOf:
            - contains:
                type: object
                properties:
                  phase:
                    const: initial
                required:
                  - phase
              minContains: 0
              maxContains: 1
            - contains:
                type: object
                properties:
                  phase:
                    const: expanded
                required:
                  - phase
              minContains: 0
              maxContains: 1
        canonicalEncodingVersion:
          enum:
            - candidate-p1.1
            - candidate-sop-task-graph-v2
          description: 服务端从相同候选 key 对应的材料取得，不由调用方选择。
      if:
        properties:
          state:
            const: not_frozen
      then:
        properties:
          frozen:
            type: "null"
          rounds:
            type: array
            maxItems: 0
      else:
        properties:
          frozen:
            type: object
      description: 当前重新授权的有界摘要，not_frozen 的 plan 仅是服务端预览。viewHash 绑定 key/canonicalEncodingVersion/plan/state/frozen/rounds（不含自己）的规范 JSON SHA-256。passed 不是组织审批或发布许可。
      allOf:
        - if:
            properties:
              state:
                enum:
                  - initial_required
          then:
            properties:
              rounds:
                type: array
                maxItems: 0
        - if:
            properties:
              state:
                enum:
                  - expansion_required
          then:
            properties:
              rounds:
                type: array
                minItems: 1
                maxItems: 1
                contains:
                  type: object
                  properties:
                    phase:
                      const: initial
                  required:
                    - phase
        - if:
            properties:
              state:
                enum:
                  - passed
                  - revision_required
                  - blocked
          then:
            properties:
              rounds:
                type: array
                minItems: 1
                contains:
                  type: object
                  properties:
                    phase:
                      const: initial
                  required:
                    - phase
        - if:
            required:
              - canonicalEncodingVersion
            properties:
              canonicalEncodingVersion:
                const: candidate-sop-task-graph-v2
          then:
            properties:
              plan:
                properties:
                  sopPlan: {}
                required:
                  - sopPlan
              rounds:
                items:
                  properties:
                    sopChecksSummary: {}
                  required:
                    - sopChecksSummary
          else:
            properties:
              plan:
                not:
                  properties:
                    sopPlan: {}
                  required:
                    - sopPlan
              rounds:
                items:
                  not:
                    properties:
                      sopChecksSummary: {}
                    required:
                      - sopChecksSummary
        - if:
            required:
              - canonicalEncodingVersion
              - state
            properties:
              canonicalEncodingVersion:
                const: candidate-sop-task-graph-v2
              state:
                const: passed
          then:
            properties:
              rounds:
                items:
                  properties:
                    sopChecksSummary:
                      properties:
                        defectCount:
                          const: 0
        - if:
            required:
              - canonicalEncodingVersion
              - state
              - plan
            properties:
              canonicalEncodingVersion:
                const: candidate-sop-task-graph-v2
              state:
                const: passed
              plan:
                required:
                  - sopPlan
                properties:
                  sopPlan:
                    properties:
                      targetCount:
                        minimum: 1
          then:
            properties:
              rounds:
                contains:
                  required:
                    - sopChecksSummary
                  properties:
                    sopChecksSummary:
                      properties:
                        checkedCount:
                          minimum: 1
    IntakeQualitySubmission:
      type: object
      additionalProperties: false
      required:
        - operationId
        - key
        - phase
        - checks
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        phase:
          type: string
          enum:
            - initial
            - expanded
        checks:
          type: array
          items:
            $ref: "#/components/schemas/IntakeQualityCheck"
          minItems: 0
          maxItems: 5000
        materialDigest:
          $ref: "#/components/schemas/IntakeSopHash"
        sopChecks:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/IntakeSopFlowCheck"
      description: 完整阶段一次原子提交，scriptId 唯一且集合精确匹配服务端冻结样本；扩样原结果不可改。空集合仅在服务端阶段样本实际为空时合法。未知字段拒绝；不接受审核人、抽样参数或结论。 SOP requires materialDigest and exact sopChecks for the frozen sopPlan. Any graph defect blocks passing regardless of FAQ sampling threshold. Omission for a SOP candidate is rejected; revisions invalidate all checks.
      dependentRequired:
        materialDigest:
          - sopChecks
        sopChecks:
          - materialDigest
    IntakeReceive:
      type: object
      additionalProperties: false
      required:
        - operationId
        - objectId
        - sourceVersion
        - baseReleaseId
        - contributorDeclaration
        - expectedPriorKey
      properties:
        operationId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        objectId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        sourceVersion:
          $ref: "#/components/schemas/IntakeVersion"
        baseReleaseId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        contributorDeclaration:
          $ref: "#/components/schemas/IntakeContributorDeclaration"
        expectedPriorKey:
          oneOf:
            - $ref: "#/components/schemas/IntakeCandidateKey"
            - type: "null"
          description: 明确 null 为新建独立候选；完整旧键为修订该候选，不得从 source/file 推测。成功解析并复算后在同事务 CAS 旧键和可修订状态，废旧并冻结同 candidateId 的下一版。解析失败保留旧版；publishing/unknown/published/cancelled/invalidated 不允许修订，返回明确冲突。
    IntakeReview:
      type: object
      additionalProperties: false
      required:
        - key
        - reviewRequestId
        - instanceCode
        - evidenceVersion
        - revocationGeneration
        - state
        - checkedAt
        - validUntil
