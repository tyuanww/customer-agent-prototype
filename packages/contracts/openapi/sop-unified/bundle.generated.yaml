        properties:
          action:
            enum:
              - next
              - choose
        required:
          - action
      then:
        properties:
          edgeId:
            $ref: "#/components/schemas/IntakeSopId"
      else:
        properties:
          edgeId:
            type: "null"
      allOf:
        - if:
            properties:
              action:
                const: copy
          then:
            properties:
              entry:
                $ref: "#/components/schemas/IntakeSopEntryRef"
          else:
            properties:
              entry:
                type: "null"
