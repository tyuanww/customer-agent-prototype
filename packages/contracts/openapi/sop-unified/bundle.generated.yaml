          $ref: "#/components/schemas/IntakeSopId"
        action:
          enum:
            - open
            - observe
            - next
            - choose
            - back
            - copy
        edgeId:
          anyOf:
            - $ref: "#/components/schemas/IntakeSopId"
            - type: "null"
        entry:
          anyOf:
            - $ref: "#/components/schemas/IntakeSopEntryRef"
            - type: "null"
