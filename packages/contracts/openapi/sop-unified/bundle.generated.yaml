          maxLength: 64
        reason:
          type: string
          minLength: 1
          maxLength: 512
    IntakeSourceList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntakeSource"
          minItems: 0
          maxItems: 100
        nextCursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
    IntakeSourceWrite:
      type: object
      additionalProperties: false
      required:
        - operationId
        - expectedVersion
        - templateVersion
        - ruleVersion
        - mappingVersion
        - structureDigest
      properties:
        operationId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        expectedVersion:
          $ref: "#/components/schemas/IntakeVersion"
        templateVersion:
          type: string
          minLength: 1
          maxLength: 64
        ruleVersion:
          type: string
          minLength: 1
          maxLength: 64
        mappingVersion:
          type: string
          minLength: 1
          maxLength: 64
        structureDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
      oneOf:
        - required:
            - templateVersion
            - ruleVersion
          properties:
            templateVersion:
              const: faq-p1.1
            ruleVersion:
              const: intake-p1.1
        - required:
            - templateVersion
            - ruleVersion
          properties:
            templateVersion:
              const: faq-csv-v1
            ruleVersion:
              const: intake-csv-v1
            mappingVersion:
              const: faq-csv-columns-v1
            structureDigest:
              const: daaa4126d63194f59949c2b6f464b108ed87a430090e4dfe36e255663ab59165
    IntakeVocabularyList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntakeVocabulary"
          minItems: 0
          maxItems: 100
        nextCursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
    IntakeVocabularyWrite:
      type: object
      additionalProperties: false
      required:
        - operationId
        - change
        - id
        - kind
        - expectedDisplayVersion
        - displayName
        - meaningDigest
      properties:
        operationId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        change:
          type: string
          enum:
            - create
            - rename
            - retire
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum:
            - product
            - scenario
        expectedDisplayVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        meaningDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
    MenokinSopQuerySopBlockedResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - release_id
        - lease_expires_at
        - result
        - reasons
      properties:
        status:
          const: blocked
        request_id:
          type: string
          format: uuid
        release_id:
          type: "null"
        lease_expires_at:
          type: "null"
        result:
          type: "null"
        reasons:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/MenokinSopQuerySopReason"
    MenokinSopQuerySopReason:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - SCOPE_DENIED
            - LEASE_EXPIRED
            - APPROVAL_REVOKED
            - SOURCE_GATE_NOT_READY
            - GRAPH_UNRESOLVED
            - TERMINAL_HAS_OUTGOING_EDGE
            - SAFETY_REVIEW_REQUIRED
            - MEDIA_UNVERIFIED
            - STALE_RELEASE
            - IDEMPOTENCY_CONFLICT
        source_ref:
          type: string
          minLength: 1
          maxLength: 512
    MenokinSopQuerySopEmptyResult:
      type: object
      additionalProperties: false
      required:
        - flow
        - entries
        - media
        - permissions
      properties:
        flow:
          type: "null"
        entries:
          type: array
          maxItems: 0
        media:
          type: array
          maxItems: 0
        permissions:
          type: array
          maxItems: 0
    MenokinSopQuerySopEntryPermission:
      type: object
      additionalProperties: false
      required:
        - entry
        - risk_level
        - copy_allowed
        - source_ref
      properties:
        entry:
          $ref: "#/components/schemas/IntakeSopEntryRef"
        risk_level:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        copy_allowed:
          type: boolean
        source_ref:
          type: string
          minLength: 1
          maxLength: 1024
    MenokinSopQuerySopErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - CONTRACT_UPGRADE_REQUIRED
            - SCOPE_DENIED
            - SOP_BLOCKED
            - SOP_STALE
            - IDEMPOTENCY_CONFLICT
            - SOP_UNAVAILABLE
        message:
          type: string
          minLength: 1
          maxLength: 256
        request_id:
          type: string
          format: uuid
    MenokinSopQuerySopNoMatchResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - release_id
        - lease_expires_at
        - result
        - reasons
      properties:
        status:
          const: no_match
        request_id:
          type: string
          format: uuid
        release_id:
          type: string
          minLength: 1
          maxLength: 256
        lease_expires_at:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/MenokinSopQuerySopEmptyResult"
        reasons:
          type: array
          maxItems: 0
    MenokinSopQuerySopQueryRequest:
      type: object
      additionalProperties: false
      required:
        - sop_group
        - shop_id
        - query_text
        - context_generation
        - request_id
      properties:
        sop_group:
          type: string
          enum:
            - 过敏流程SOP
            - 长痘痘SOP
            - 品质售后SOP
            - 少错破SOP
            - 税收相关规则
        shop_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[-A-Za-z0-9._:]+$
        product_context:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - type
                - ref
              properties:
                type:
                  type: string
                  enum:
                    - storewide
                    - category
                    - sku
                ref:
                  type: string
                  minLength: 1
                  maxLength: 256
        query_text:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: \S
        context_generation:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
        request_id:
          type: string
          format: uuid
    MenokinSopQuerySopQueryResponse:
      oneOf:
        - $ref: "#/components/schemas/MenokinSopQuerySopReadyResponse"
        - $ref: "#/components/schemas/MenokinSopQuerySopBlockedResponse"
        - $ref: "#/components/schemas/MenokinSopQuerySopStaleResponse"
        - $ref: "#/components/schemas/MenokinSopQuerySopNoMatchResponse"
      discriminator:
        propertyName: status
    MenokinSopQuerySopReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - release_id
        - lease_expires_at
        - result
        - reasons
      properties:
        status:
          const: ready
        request_id:
          type: string
          format: uuid
        release_id:
          type: string
          minLength: 1
          maxLength: 256
        lease_expires_at:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/MenokinSopQuerySopReadyResult"
        reasons:
          type: array
          maxItems: 0
    MenokinSopQuerySopReadyResult:
      type: object
      additionalProperties: false
      required:
        - flow
        - graph_digest
        - entries
        - media
        - permissions
      properties:
        flow:
          $ref: "#/components/schemas/IntakeSopFlowDefinition"
        entries:
          type: array
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required:
              - sourceId
              - entry
            properties:
              sourceId:
                $ref: "#/components/schemas/IntakeSopId"
              entry:
                $ref: "#/components/schemas/IntakePublishedEntry"
        media:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              - binding
              - preview_handle
              - expires_at
            properties:
              binding:
                $ref: "#/components/schemas/IntakeSopMedia"
              preview_handle:
                type: string
                minLength: 1
                maxLength: 256
              expires_at:
                type: string
                format: date-time
        permissions:
          type: array
          maxItems: 4096
          items:
            $ref: "#/components/schemas/MenokinSopQuerySopEntryPermission"
        graph_digest:
          $ref: "#/components/schemas/IntakeSopHash"
    MenokinSopQuerySopStaleResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - release_id
        - lease_expires_at
        - result
        - reasons
      properties:
        status:
          const: stale
        request_id:
          type: string
          format: uuid
        release_id:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 256
            - type: "null"
        lease_expires_at:
          type: "null"
        result:
          type: "null"
        reasons:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/MenokinSopQuerySopReason"
    SopCandidateMaterial:
      type: object
      additionalProperties: false
      required:
        - candidateId
        - version
        - sheets
        - contentHash
      properties:
        candidateId:
          $ref: "#/components/schemas/IntakeId"
        version:
          $ref: "#/components/schemas/IntakeVersion"
        sheets:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - rows
            properties:
              name:
                type: string
                enum:
                  - 过敏流程SOP
                  - 少错破SOP
                  - 品质售后SOP
                  - 税收相关规则
                  - 品牌对接资源汇总
                  - 长痘痘SOP
              rows:
                type: array
                items:
                  $ref: "#/components/schemas/SopCandidateRow"
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
    SopCandidateRow:
      type: object
      additionalProperties: false
      required:
        - rowId
        - sheetName
        - rowNumber
        - answer
        - media
      properties:
        rowId:
          type: string
          pattern: ^sop:[^:]{1,128}:[1-9][0-9]{0,3}$
        sheetName:
          type: string
          enum:
            - 过敏流程SOP
            - 少错破SOP
            - 品质售后SOP
            - 税收相关规则
            - 品牌对接资源汇总
            - 长痘痘SOP
        rowNumber:
          type: integer
          minimum: 1
          maximum: 5000
        answer:
          type: string
          minLength: 1
          maxLength: 20000
        media:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SopMediaObject"
    SopMediaObject:
      type: object
      additionalProperties: false
      required:
        - mediaObjectId
        - sheetName
        - rowNumber
        - ordinal
        - sha256
        - mime
        - bytes
      properties:
        mediaObjectId:
          $ref: "#/components/schemas/IntakeId"
        sheetName:
          type: string
          enum:
            - 过敏流程SOP
            - 少错破SOP
            - 品质售后SOP
            - 税收相关规则
            - 品牌对接资源汇总
            - 长痘痘SOP
        rowNumber:
          type: integer
          minimum: 1
          maximum: 5000
        ordinal:
          type: integer
          minimum: 1
          maximum: 100
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        mime:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/gif
        bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        preview:
          $ref: "#/components/schemas/SopPreview"
    SopPreview:
      type: object
      additionalProperties: false
      required:
        - previewToken
        - expiresAt
      properties:
        previewToken:
          type: string
          minLength: 1
          maxLength: 512
        expiresAt:
          type: string
          format: date-time
          maxLength: 35
      description: 系统内短期预览引用，不是永久 URL。
    SopPublishCommand:
      type: object
      additionalProperties: false
      required:
        - operationId
        - contentHash
        - confirm
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        confirm:
          const: true
    SopPublishReceipt:
      type: object
      additionalProperties: false
      required:
        - releaseId
        - contentHash
        - state
      properties:
        releaseId:
          $ref: "#/components/schemas/IntakeId"
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        state:
          const: published
    SopRollbackCommand:
      type: object
      additionalProperties: false
      required:
        - rollbackPlanId
        - operationId
        - confirm
      properties:
        rollbackPlanId:
          $ref: "#/components/schemas/IntakeId"
        operationId:
          $ref: "#/components/schemas/IntakeId"
        confirm:
          const: true
    SopRollbackReceipt:
      type: object
      additionalProperties: false
      required:
        - releaseId
        - state
      properties:
        releaseId:
          $ref: "#/components/schemas/IntakeId"
        state:
          const: rolled_back
    SopUploadReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - candidateId
        - version
        - state
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        candidateId:
          $ref: "#/components/schemas/IntakeId"
        version:
          $ref: "#/components/schemas/IntakeVersion"
        state:
          type: string
          enum:
            - staged
            - idempotent
  responses:
    MenokinSopQueryValidationError:
      description: 严格 body/header 校验失败。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MenokinSopQuerySopErrorEnvelope"
    MenokinSopQueryUnauthorized:
      description: 产品会话无效或缺失。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MenokinSopQuerySopErrorEnvelope"
    MenokinSopQueryForbidden:
      description: 当前主体没有该店铺或 SOP 查询资格。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MenokinSopQuerySopErrorEnvelope"
    MenokinSopQueryConflict:
      description: 合同、release、lease 或幂等键冲突。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MenokinSopQuerySopErrorEnvelope"
    MenokinSopQuerySopBlocked:
      description: 图完整性、安全或媒体条件阻断查询。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MenokinSopQuerySopErrorEnvelope"
    MenokinSopQueryUnavailable:
      description: 来源门或服务依赖不可用，必须 fail closed。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MenokinSopQuerySopErrorEnvelope"
  securitySchemes:
    ProductSession:
      type: http
      scheme: bearer
      bearerFormat: opaque product session
