    IntakeQuestion:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - text
        - active
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        version:
          $ref: "#/components/schemas/IntakeVersion"
        text:
          type: string
          minLength: 1
          maxLength: 4096
        active:
          type: boolean
    IntakeTermRef:
      type: object
      additionalProperties: false
      required:
        - id
        - displayVersion
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        displayVersion:
          $ref: "#/components/schemas/IntakeVersion"
    IntakeDifference:
      type: object
      additionalProperties: false
      required:
        - businessEntryId
        - change
        - previousVersion
        - nextVersion
        - beforeDigest
        - afterDigest
      properties:
        businessEntryId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        change:
          type: string
          enum:
            - add
            - modify
            - disable
            - reenable
        previousVersion:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 9007199254740991
        nextVersion:
          $ref: "#/components/schemas/IntakeVersion"
        beforeDigest:
          type:
            - string
            - "null"
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        afterDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
    IntakeMaterialHeader:
      type: object
      additionalProperties: false
      required:
        - canonicalEncodingVersion
        - scope
        - sourceVersion
        - sourceClaim
        - templateVersion
        - ruleVersion
        - mappingVersion
        - selectedSheets
        - object
        - contributors
        - risk
        - baseReleaseId
        - media
      properties:
        canonicalEncodingVersion:
          enum:
            - candidate-p1.1
            - candidate-sop-graph-v1
            - candidate-sop-task-graph-v2
        scope:
          $ref: "#/components/schemas/IntakeSopSourceScope"
        sourceVersion:
          $ref: "#/components/schemas/IntakeVersion"
        sourceClaim:
          $ref: "#/components/schemas/IntakeSourceClaim"
        templateVersion:
          type: string
          minLength: 1
          maxLength: 64
        ruleVersion:
          type: string
          minLength: 1
          maxLength: 64
        mappingVersion:
          type: string
          minLength: 1
          maxLength: 64
        selectedSheets:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 1
          maxItems: 16
        object:
          $ref: "#/components/schemas/IntakeObject"
        contributors:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            minLength: 1
            maxLength: 128
          minItems: 1
          maxItems: 100
        risk:
