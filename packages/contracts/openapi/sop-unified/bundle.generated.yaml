                - MATERIAL_CHANGED
                - BASE_CHANGED
                - APPROVAL_CHANGED
                - APPROVAL_REVOKED
                - TICKET_EXPIRED
                - TICKET_CONSUMED
                - IDEMPOTENCY_CONFLICT
