          maxItems: 6
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - rows
            properties:
              name:
                type: string
                enum:
                  - 过敏流程SOP
                  - 少错破SOP
                  - 品质售后SOP
                  - 税收相关规则
                  - 品牌对接资源汇总
                  - 长痘痘SOP
              rows:
                type: array
                items:
                  $ref: "#/components/schemas/SopCandidateRow"
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
    SopUploadReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - candidateId
        - version
        - state
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        candidateId:
          $ref: "#/components/schemas/IntakeId"
        version:
          $ref: "#/components/schemas/IntakeVersion"
        state:
          type: string
          enum:
            - staged
            - idempotent
    SopPublishCommand:
      type: object
      additionalProperties: false
      required:
        - operationId
        - contentHash
        - confirm
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        confirm:
          const: true
    SopPublishReceipt:
      type: object
      additionalProperties: false
      required:
        - releaseId
        - contentHash
        - state
      properties:
        releaseId:
          $ref: "#/components/schemas/IntakeId"
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        state:
          const: published
    SopRollbackCommand:
      type: object
      additionalProperties: false
      required:
        - rollbackPlanId
        - operationId
        - confirm
      properties:
        rollbackPlanId:
          $ref: "#/components/schemas/IntakeId"
        operationId:
          $ref: "#/components/schemas/IntakeId"
        confirm:
          const: true
    SopRollbackReceipt:
      type: object
      additionalProperties: false
      required:
        - releaseId
        - state
      properties:
        releaseId:
          $ref: "#/components/schemas/IntakeId"
        state:
          const: rolled_back
    IntakeShopDisplay:
      type: object
      additionalProperties: false
      required:
        - shopId
        - displayName
        - displayVersion
      properties:
        shopId:
          $ref: "#/components/schemas/IntakeId"
        displayName:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\s\u0000-\u001f\u007f\u2028\u2029](?:[^\u0000-\u001f\u007f\u2028\u2029]*[^\s\u0000-\u001f\u007f\u2028\u2029])?$
        displayVersion:
          $ref: "#/components/schemas/IntakeVersion"
    IntakeShopDirectory:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - validUntil
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntakeShopDisplay"
          minItems: 0
          maxItems: 100
        nextCursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
        validUntil:
          type: string
          format: date-time
          maxLength: 35
          description: 本页与后续同一次目录读取共用的最早截止。它不是新的业务授权。
    IntakeManagementContext:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - sourceVersion
        - baseReleaseId
        - principalId
        - factsVersion
        - validUntil
      properties:
        sourceId:
          $ref: "#/components/schemas/IntakeId"
        sourceVersion:
          $ref: "#/components/schemas/IntakeVersion"
        baseReleaseId:
          oneOf:
            - $ref: "#/components/schemas/IntakeId"
            - type: "null"
        principalId:
          $ref: "#/components/schemas/IntakeId"
        factsVersion:
          $ref: "#/components/schemas/IntakeVersion"
        validUntil:
          type: string
          format: date-time
          maxLength: 35
      description: 服务端已认证主体的已确认 principal 映射。validUntil 不是离线授权；Main 在创建候选前重读并保留原操作的精确输入进行不确定结果恢复。参与人目录复用 IntakePrincipalPage；本对象不包含展示名或整份权限。
    IntakeQualityReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - action
        - key
        - state
        - phase
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        action:
          type: string
          enum:
            - quality-freeze
            - quality-check
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        state:
          type: string
          enum:
            - initial_required
            - expansion_required
            - passed
            - revision_required
            - blocked
        phase:
          oneOf:
            - type: string
              enum:
                - initial
                - expanded
            - type: "null"
      if:
        properties:
          action:
            const: quality-freeze
      then:
        properties:
          phase:
            type: "null"
      else:
        properties:
          phase:
            type: string
            enum:
              - initial
              - expanded
          state:
            type: string
            enum:
              - expansion_required
              - passed
              - revision_required
              - blocked
      description: 永久操作的精简历史结果，不含正文、逐条原因、权限或新的使用资格。只有当前有效会话的原主体能恢复；不将历史 state 当成当前状态。
      allOf:
        - if:
            properties:
              phase:
                const: expanded
          then:
            properties:
              state:
                type: string
                enum:
                  - passed
                  - revision_required
                  - blocked
    IntakeQualitySamplePage:
      type: object
      additionalProperties: false
      required:
        - key
        - viewHash
        - phase
        - selectionManifestHash
        - items
        - nextCursor
      properties:
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        viewHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        phase:
          type: string
          enum:
            - initial
            - expanded
        selectionManifestHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntakeQualitySample"
          minItems: 0
          maxItems: 100
        nextCursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
      description: 按服务端冻结抽样顺序分页；entry 完整保真且只可 upsert，check 的 ID/hash 必须与所在 sample 一致。每页 8 MiB 上限可提前截页，但不得截断单条、漏行或返回有 nextCursor 的空页。
      if:
        properties:
          nextCursor:
            type: string
      then:
        properties:
          items:
            type: array
            minItems: 1
    IntakeQualitySample:
      type: object
      additionalProperties: false
      required:
        - scriptId
        - contentHash
        - mandatory
        - entry
        - check
      properties:
        scriptId:
          type: string
          pattern: ^intake_[0-9a-f]{64}$
          minLength: 71
          maxLength: 71
        contentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        mandatory:
          type: boolean
        entry:
          allOf:
            - $ref: "#/components/schemas/IntakeEntry"
            - type: object
              properties:
                operation:
                  const: upsert
        check:
          oneOf:
            - $ref: "#/components/schemas/IntakeQualityCheck"
            - type: "null"
    IntakeQualityStatus:
      type: object
      additionalProperties: false
      required:
        - key
        - viewHash
        - state
        - plan
        - frozen
        - rounds
      properties:
        key:
          $ref: "#/components/schemas/IntakeCandidateKey"
        viewHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        state:
          type: string
          enum:
            - not_frozen
            - initial_required
            - expansion_required
            - passed
            - revision_required
            - blocked
        plan:
          $ref: "#/components/schemas/IntakeQualityPlan"
        frozen:
          oneOf:
            - $ref: "#/components/schemas/IntakeQualityAttribution"
            - type: "null"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/IntakeQualityRound"
          minItems: 0
          maxItems: 2
          allOf:
            - contains:
                type: object
                properties:
                  phase:
                    const: initial
                required:
                  - phase
              minContains: 0
              maxContains: 1
            - contains:
                type: object
                properties:
                  phase:
                    const: expanded
                required:
                  - phase
              minContains: 0
              maxContains: 1
      if:
        properties:
          state:
            const: not_frozen
      then:
        properties:
          frozen:
            type: "null"
          rounds:
            type: array
            maxItems: 0
      else:
        properties:
          frozen:
            type: object
      description: 当前重新授权的有界摘要，not_frozen 的 plan 仅是服务端预览。viewHash 绑定 key/plan/state/frozen/rounds（不含自己）的规范 JSON SHA-256。passed 不是组织审批或发布许可。
      allOf:
        - if:
            properties:
              state:
                enum:
                  - initial_required
          then:
            properties:
              rounds:
                type: array
                maxItems: 0
        - if:
            properties:
              state:
                enum:
                  - expansion_required
          then:
            properties:
              rounds:
                type: array
                minItems: 1
                maxItems: 1
                contains:
                  type: object
                  properties:
                    phase:
                      const: initial
                  required:
                    - phase
        - if:
            properties:
              state:
                enum:
                  - passed
                  - revision_required
                  - blocked
          then:
            properties:
              rounds:
                type: array
                minItems: 1
                contains:
                  type: object
                  properties:
                    phase:
                      const: initial
                  required:
                    - phase
    IntakeQualityRound:
      type: object
      additionalProperties: false
      required:
        - phase
        - reviewer
        - checkedCount
        - defectCount
      properties:
        phase:
          type: string
          enum:
            - initial
            - expanded
        reviewer:
