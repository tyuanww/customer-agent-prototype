        file:
          type: string
          format: binary
    SopMediaObject:
      type: object
      additionalProperties: false
      required:
        - mediaObjectId
        - sheetName
        - rowNumber
        - ordinal
        - sha256
        - mime
        - bytes
      properties:
        mediaObjectId:
          $ref: "#/components/schemas/IntakeId"
        sheetName:
          type: string
          enum:
            - 过敏流程SOP
            - 少错破SOP
            - 品质售后SOP
            - 税收相关规则
            - 品牌对接资源汇总
            - 长痘痘SOP
        rowNumber:
          type: integer
          minimum: 1
          maximum: 5000
        ordinal:
          type: integer
          minimum: 1
          maximum: 100
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        mime:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/gif
        bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        preview:
          $ref: "#/components/schemas/SopPreview"
    SopPreview:
      type: object
      additionalProperties: false
      required:
        - previewToken
        - expiresAt
      properties:
        previewToken:
          type: string
          minLength: 1
          maxLength: 512
        expiresAt:
          type: string
          format: date-time
          maxLength: 35
      description: 系统内短期预览引用，不是永久 URL。
    SopCandidateRow:
      type: object
      additionalProperties: false
      required:
        - rowId
        - sheetName
        - rowNumber
        - answer
        - media
      properties:
        rowId:
          type: string
          pattern: ^sop:[^:]{1,128}:[1-9][0-9]{0,3}$
        sheetName:
          type: string
          enum:
            - 过敏流程SOP
            - 少错破SOP
            - 品质售后SOP
            - 税收相关规则
            - 品牌对接资源汇总
            - 长痘痘SOP
        rowNumber:
          type: integer
          minimum: 1
          maximum: 5000
        answer:
          type: string
          minLength: 1
          maxLength: 20000
        media:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SopMediaObject"
    SopCandidateMaterial:
      type: object
      additionalProperties: false
      required:
        - candidateId
        - version
        - sheets
        - contentHash
      properties:
        candidateId:
          $ref: "#/components/schemas/IntakeId"
        version:
          $ref: "#/components/schemas/IntakeVersion"
        sheets:
          type: array
