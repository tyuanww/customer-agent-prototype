    ContentQualityReviewSummary:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - sampling_policy_version
        - cutoff_at
        - clean_population_count
        - ordinary_population_count
        - mandatory_full_review_count
        - initial_sample_target
        - expanded_sample_target
        - initial_sample_reviewed_count
        - initial_defect_count
        - expanded_sample_reviewed_count
        - expanded_defect_count
        - mandatory_reviewed_count
        - mandatory_defect_count
        - publishable_clean_count
        - review_quarantined_count
        - conclusion
        - evidence_ref
      properties:
        plan_id:
          type: string
          pattern: ^qplan_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$
        sampling_policy_version:
          type: string
          minLength: 1
          maxLength: 128
        cutoff_at:
          type: string
          format: date-time
        clean_population_count:
          type: integer
          minimum: 0
          maximum: 5000
        ordinary_population_count:
          type: integer
          minimum: 0
          maximum: 5000
        mandatory_full_review_count:
          type: integer
          minimum: 0
          maximum: 5000
        initial_sample_target:
          type: integer
          minimum: 0
          maximum: 5000
        expanded_sample_target:
          type: integer
          minimum: 0
          maximum: 5000
        initial_sample_reviewed_count:
          type: integer
          minimum: 0
          maximum: 5000
        initial_defect_count:
          type: integer
          minimum: 0
          maximum: 5000
        expanded_sample_reviewed_count:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 5000
        expanded_defect_count:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 5000
        mandatory_reviewed_count:
          type: integer
          minimum: 0
          maximum: 5000
        mandatory_defect_count:
          type: integer
          minimum: 0
          maximum: 5000
        publishable_clean_count:
          type: integer
          minimum: 0
          maximum: 5000
        review_quarantined_count:
          type: integer
          minimum: 0
          maximum: 5000
        conclusion:
          type: string
          enum:
            - passed
            - blocked
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 256
      description: |
        服务端受限证据投影；不是上传文件或普通 worker 可写字段。high/conflict 行计入
        mandatory_full_review_count 并 100% 复核。
    ImportStatusResponseBase:
      type: object
      additionalProperties: false
      required:
        - import_batch_id
        - status
        - base_release_id
        - source_binding_hash
        - source_bindings
        - error_report
        - staged_count
        - clean_count
        - quarantined_count
        - quality_gate_passed
        - quality_review
        - preview
      properties:
        import_batch_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ImportStatus"
        base_release_id:
          type:
            - string
            - "null"
          description: enqueue 时锁定的 current release；首次发布前为 null。
        source_binding_hash:
          $ref: "#/components/schemas/SourceBindingHash"
        source_bindings:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          x-unique-by: domain
          items:
            $ref: "#/components/schemas/AuthoritativeSourceBindingStatus"
        error_report:
          $ref: "#/components/schemas/ImportErrorReport"
        staged_count:
          type: integer
          minimum: 0
        clean_count:
          type: integer
          minimum: 0
        quarantined_count:
          type: integer
          minimum: 0
        quality_gate_passed:
          type: boolean
          description: 至少一条 clean 行通过批次抽检门；不代表 quarantined 行可发布。
        quality_review:
          oneOf:
            - $ref: "#/components/schemas/ContentQualityReviewSummary"
            - type: "null"
          description: validating/failed 尚无完整证据时可为 null；进入 staged 前必须已通过。
        preview:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewItem"
    ImportStatusResponse:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ImportStatusResponseBase"
            - type: object
              properties:
                status:
                  const: failed
                error_report:
                  $ref: "#/components/schemas/ImportFailureReport"
        - allOf:
            - $ref: "#/components/schemas/ImportStatusResponseBase"
            - type: object
              properties:
                status:
                  enum:
                    - validating
                    - staged
                    - publishing
                    - published
                    - rolled_back
                error_report:
                  type: "null"
    CancelImportRequest:
