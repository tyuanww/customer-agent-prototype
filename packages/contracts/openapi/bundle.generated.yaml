          properties:
            rollback_of_release_id:
              type: string
              minLength: 1
    Announcement:
      type: object
      additionalProperties: false
      description: 公开公告的封闭白名单投影；不得透传创建主体或内部定位字段。
      required:
        - title
        - summary
        - created_at
      properties:
        title:
          type: string
        summary:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
    CurrentAnnouncementResponse:
      type: object
      additionalProperties: false
      description: handler 必须显式映射顶层、offline_lease 与 announcement 白名单。
      required:
        - current_release_id
        - release_seq
        - source_binding_hash
        - offline_lease
        - announcement
      properties:
        current_release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        source_binding_hash:
          $ref: "#/components/schemas/SourceBindingHash"
        offline_lease:
          $ref: "#/components/schemas/OfflineSnapshotLease"
        announcement:
          oneOf:
            - $ref: "#/components/schemas/Announcement"
            - type: "null"
    PublicSnapshotQuestion:
      type: object
      additionalProperties: false
      description: |
        离线检索所需的最小 Question 投影。禁止暴露 origin HMAC/密钥版本、
        source_query_id、source_asset_id、promotion review、role 或时间字段。
      required:
        - question_id
        - question_version
        - question_text
        - question_hash
        - semantic_family_id
      properties:
        question_id:
          type: string
          pattern: ^q_[A-Za-z0-9][A-Za-z0-9_-]{7,126}$
        question_version:
          type: integer
          minimum: 1
        question_text:
          type: string
          minLength: 1
          maxLength: 500
        question_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        semantic_family_id:
          type: string
          pattern: ^sf_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$
    SnapshotItem:
      type: object
      additionalProperties: false
      description: |
        固定 release 中的不可变、封闭公开投影。响应中出现不代表该项当前有效；
        客户端每次检索都必须自行执行有效期过滤。禁止 DB row/internal object spread。
      required:
        - script_id
        - script_version
        - content_hash
        - title
        - category
        - answer_text
        - platform_scope
        - product_scope_type
        - product_scope_refs
        - effective_from
        - effective_to
        - intent_taxonomy_version
        - intent_id
        - risk_level
        - risk_categories
        - has_conflict
        - placeholder_keys
        - questions
      properties:
        script_id:
          type: string
          minLength: 1
        script_version:
          type: integer
          minimum: 1
        content_hash:
          $ref: "#/components/schemas/ContentHash"
        title:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/ScriptCategory"
        answer_text:
          type: string
          minLength: 1
        platform_scope:
          $ref: "#/components/schemas/PlatformScope"
        product_scope_type:
          $ref: "#/components/schemas/ProductScopeType"
        product_scope_refs:
          $ref: "#/components/schemas/ProductScopeRefs"
        effective_from:
          type: string
          format: date-time
          description: |
            包含下界。完整 release snapshot 可包含未到生效时间的项；
            客户端只能在 `effective_from <= now` 时将其纳入本地检索。
        effective_to:
          type:
            - string
            - "null"
          format: date-time
          description: |
            排他上界。完整 release snapshot 可包含已过期项，服务端不按当前时间过滤；
            客户端只能在 `effective_to IS NULL OR now < effective_to` 时纳入本地检索，
            `now == effective_to` 必须排除。
        intent_taxonomy_version:
          $ref: "#/components/schemas/IntentTaxonomyVersion"
        intent_id:
          $ref: "#/components/schemas/IntentId"
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_categories:
          $ref: "#/components/schemas/RiskCategories"
        has_conflict:
          type: boolean
        placeholder_keys:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: "#/components/schemas/PlaceholderKey"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/PublicSnapshotQuestion"
      allOf:
        - oneOf:
            - properties:
                product_scope_type:
                  const: storewide
                product_scope_refs:
                  maxItems: 0
            - properties:
                product_scope_type:
                  enum:
                    - category
                    - sku
                product_scope_refs:
                  minItems: 1
        - oneOf:
            - properties:
                risk_level:
                  enum:
                    - low
                    - medium
                risk_categories:
                  maxItems: 0
            - properties:
                risk_level:
                  const: high
                risk_categories:
                  minItems: 1
    SnapshotResponse:
      type: object
      additionalProperties: false
      description: |
        固定 release 的完整、不可变分页快照响应。页集合不按生效时间改变；
        租约有效时，客户端每次本地检索必须再执行每项的时间窗口过滤。
      required:
        - release_id
        - release_seq
        - source_binding_hash
        - offline_lease
        - items
        - next_cursor
      properties:
        release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        source_binding_hash:
          $ref: "#/components/schemas/SourceBindingHash"
        offline_lease:
          $ref: "#/components/schemas/OfflineSnapshotLease"
        items:
          type: array
          description: 当页完整快照项；不是“当前有效项”的服务端过滤结果。
          items:
            $ref: "#/components/schemas/SnapshotItem"
        next_cursor:
          type:
            - string
            - "null"
          description: 本页最后一个 script_id；无更多时为 null。
    AnnouncementAckRequest:
      type: object
      additionalProperties: false
      required:
        - client_id
        - release_id
        - release_seq
        - offline_lease_token
      properties:
        client_id:
          type: string
          minLength: 1
        release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        offline_lease_token:
          $ref: "#/components/schemas/OfflineSnapshotLeaseToken"
    OkResponse:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          const: true
    PolicyFlagKey:
      type: string
      enum:
        - rewrite
        - auto_send
        - autofill_adapter
        - llm_ranker
        - metrics_experimental_kpi
    MutablePolicyFlagKey:
      type: string
      enum:
        - autofill_adapter
        - llm_ranker
        - metrics_experimental_kpi
    Phase1HardOffPolicyFlagKey:
      type: string
      enum:
        - rewrite
        - auto_send
    PolicyResponse:
      type: object
      required:
        - rewrite
        - auto_send
        - autofill_adapter
        - llm_ranker
        - metrics_experimental_kpi
        - auth_mode
      properties:
        rewrite:
          const: false
          description: Phase 1 hard-off。
        auto_send:
          const: false
          description: Phase 1 hard-off；启用需独立立项与 /v2。
        autofill_adapter:
          type: boolean
        llm_ranker:
          type: boolean
        metrics_experimental_kpi:
          type: boolean
        auth_mode:
          $ref: "#/components/schemas/AuthMode"
    PolicyFlagUpdateRequest:
      oneOf:
        - $ref: "#/components/schemas/MutablePolicyFlagUpdateRequest"
        - $ref: "#/components/schemas/HardOffPolicyFlagUpdateRequest"
      discriminator:
        propertyName: flag_key
        mapping:
          rewrite: "#/components/schemas/HardOffPolicyFlagUpdateRequest"
          auto_send: "#/components/schemas/HardOffPolicyFlagUpdateRequest"
          autofill_adapter: "#/components/schemas/MutablePolicyFlagUpdateRequest"
          llm_ranker: "#/components/schemas/MutablePolicyFlagUpdateRequest"
          metrics_experimental_kpi: "#/components/schemas/MutablePolicyFlagUpdateRequest"
      description: |
        hard-off 分支允许表达 flag_value=true 请求，以便合同明确该请求的 403
        POLICY_DENIED 响应；允许通过语法校验不代表允许持久化。
    MutablePolicyFlagUpdateRequest:
      type: object
      required:
        - flag_key
        - flag_value
        - adr_id
      properties:
        flag_key:
          $ref: "#/components/schemas/MutablePolicyFlagKey"
        flag_value:
          type: boolean
        adr_id:
          type:
            - string
            - "null"
          pattern: ^ADR-[A-Za-z0-9._-]+$
    HardOffPolicyFlagUpdateRequest:
      type: object
      required:
        - flag_key
        - flag_value
        - adr_id
      x-phase1-denied-when:
        flag_value: true
        responseStatus: 403
        errorCode: POLICY_DENIED
      properties:
        flag_key:
          $ref: "#/components/schemas/Phase1HardOffPolicyFlagKey"
        flag_value:
          type: boolean
          description: false 可保持 hard-off；true 必须返回 403，且不得写库。
        adr_id:
          type:
            - string
            - "null"
          pattern: ^ADR-[A-Za-z0-9._-]+$
    PolicyFlagUpdateResponse:
      type: object
      required:
        - ok
        - flag_key
        - flag_value
      properties:
        ok:
          const: true
        flag_key:
          $ref: "#/components/schemas/PolicyFlagKey"
        flag_value:
          type: boolean
