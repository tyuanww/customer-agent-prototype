              $ref: "#/components/schemas/ImportDiagnosticId"
            attempts:
              type: integer
              minimum: 1
            max_attempts:
              type: integer
              minimum: 1
        - type: object
          additionalProperties: false
          required:
            - code
            - diagnostic_id
          properties:
