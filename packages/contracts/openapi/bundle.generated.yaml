        excluded-reasons-standard-audit: all-non-source-or-lease-reasons
        rationale: 仅来源门或离线租约 reason 写最小 source denial audit；其他 ACK 错误继续走标准受控 error audit。
      x-source-denial-audit-required: true
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementAckRequest"
            examples:
              synced:
                value:
                  client_id: mac-cs-001
                  release_id: rel-20260806-0013
                  release_seq: 13
                  offline_lease_token: osl_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        "200":
          description: 同步游标已写入，或旧 ACK 被安全忽略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              examples:
                success:
                  value:
                    ok: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrPolicyDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Overloaded"
  /v1/policy:
    get:
      tags:
        - policy
      operationId: getPolicy
      summary: 获取一期策略与只读鉴权模式
      description: 未知 flag 读取按最严 OFF；auth_mode 只来自部署配置，不属于 policy_flags。
      responses:
        "200":
          description: 当前策略；一期 rewrite 与 auto_send 恒为 false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
              examples:
                phase1:
                  value:
                    rewrite: false
                    auto_send: false
                    autofill_adapter: false
                    llm_ranker: false
                    metrics_experimental_kpi: false
                    auth_mode: feishu
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Overloaded"
  /v1/policy/flags:
    post:
      tags:
        - policy
      operationId: setPolicyFlag
      summary: 通过唯一受控入口写策略开关
      description: |
        一期仅 Owner，且服务端必须调用 set_policy_flag。rewrite=true 或 auto_send=true
        即使带 ADR 也必须返回 403 POLICY_DENIED；mock_auth 与未知 key 返回 400。
      x-required-roles:
        - owner
      x-phase1-owner-only: true
      x-phase1-hard-off:
        flags:
          - rewrite
          - auto_send
        deniedValue: true
        responseStatus: 403
        errorCode: POLICY_DENIED
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyFlagUpdateRequest"
            examples:
              enableRanker:
                value:
                  flag_key: llm_ranker
                  flag_value: true
                  adr_id: ADR-012
              hardOffRewrite:
                summary: 语法有效，但一期必须以 403 POLICY_DENIED 拒绝
                value:
                  flag_key: rewrite
                  flag_value: true
                  adr_id: ADR-099
      responses:
        "200":
          description: 可写策略已更新，或 hard-off 开关保持 false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyFlagUpdateResponse"
              examples:
                success:
                  value:
                    ok: true
                    flag_key: llm_ranker
                    flag_value: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrPolicyDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Overloaded"
  /v1/intake/sop/candidates/{candidateId}/versions/{version}/row-deletions:
    post:
      operationId: reviseUnusedSopRow
      summary: 删除未使用的 SOP 行并生成下一候选版本
      description: 路径 candidateId/version 必须与 key 一致，身份只来自产品会话。保留旧正文和摘要；剩余行生成新版本，来源证据与质量必须重新检查。最后一行取消候选，不生成空的可发布目录。当前或历史发布行不得删除。旧候选无可靠行绑定时拒绝，不从图片顺序推断。相同 operationId 与载荷返回永久回执；改载荷拒绝；提交未知保留预览直到原操作重放确认。响应只投影至匹配候选版本，旧回执不得清除新预览。
      tags:
        - content-intake
        - sop
      security:
        - ProductSession: []
      x-required-intake-action: candidate-cancel
      x-production-consumer-ready: false
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IntakeId"
        - name: version
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IntakeVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operationId
                - key
                - rowId
              additionalProperties: false
              properties:
                operationId:
                  $ref: "#/components/schemas/IntakeId"
                key:
                  $ref: "#/components/schemas/IntakeCandidateKey"
                rowId:
                  type: string
                  pattern: ^sop:[^:]{1,128}:[1-9][0-9]{0,3}$
      responses:
        "200":
          description: 完整下一候选或已取消的原候选；历史不改写。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeCandidate"
        "400":
          description: 输入非法或路径与 key 不一致。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "401":
          description: 产品会话无效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "404":
          description: 资源不存在或无权；同一 NOT_FOUND，不泄露存在性。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "409":
          description: 版本/来源/基线变化，已发布或提交未知。COMMIT_UNKNOWN 时保留 operationId 并重放，不能重新生成操作。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "503":
          description: 暂时无法确认，保留 operationId 与预览以重放核对。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
components:
  securitySchemes:
    ProductSession:
      type: http
      scheme: bearer
      bearerFormat: opaque product session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque product session
      description: 产品会话，服务端按数据库当前主体资格认证；禁止把提供方 token、客户端角色或可本地验签的 JWT 当作产品身份。mock 仅限显式开发测试配置。
    mockUser:
      type: apiKey
      in: header
      name: X-Mock-User
      description: 仅 development/test 且 AUTH_MODE=mock；必须与 X-Mock-Role 同时出现。
    mockRole:
      type: apiKey
      in: header
      name: X-Mock-Role
      description: 仅 development/test，值为 agent、coach 或 owner；请求日志必须标记 AUTH_MOCK。
  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        同 scope/key/body 重放首次终态响应；同键异体或处理中返回 409。建议 UUID。
        终态 TTL 至少 24 小时。
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 5a5d8ff9-a23e-4c04-b902-64d0e33502cf
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 提供时按共用幂等状态机处理；本路由在 39 合同中未列为强制携带。
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 68cc44fb-3d14-4860-a765-e882754d66d7
    ImportBatchId:
      name: import_batch_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: imp-01J4PF9TQX7G
    IterationTaskId:
      name: task_id
      in: path
      required: true
      description: 内部话术优化待办 ID；不得填业务工单 ID。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: itask-01J4PF9TQX7G
    IterationTaskStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/IterationTaskStatus"
    IterationTaskSignalFilter:
      name: signal_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IterationTaskAssigneeFilter:
      name: assignee_role
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderImportBatchId:
      name: import_batch_id
      in: path
      required: true
      description: 业务工单分析导入批次 ID。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: woimp-01J4PF9TQX7G
    WorkOrderFrom:
      name: from
      in: query
      required: true
      description: 业务记录时间窗起点；与 to 构成半开区间，最大 31 天。
      schema:
        type: string
        format: date-time
      example: 2026-07-01T00:00:00Z
    WorkOrderTo:
      name: to
      in: query
      required: true
      description: 业务记录时间窗终点；必须晚于 from，差值不超过 31 天。
      schema:
        type: string
        format: date-time
      example: 2026-08-01T00:00:00Z
    WorkOrderImportBatchFilter:
      name: import_batch_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderChannelFilter:
      name: channel
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderCategoryFilter:
      name: category
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderIssueTypeFilter:
      name: issue_type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderErrorTypeFilter:
      name: error_type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderEscalatedFilter:
      name: escalated
      in: query
      required: false
      schema:
        type: boolean
    WorkOrderLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    WorkOrderCursor:
      name: cursor
      in: query
      required: false
      description: 不透明、稳定倒序的业务工单明细游标。
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    MetricsFrom:
      name: from
      in: query
      required: true
      description: 查询窗起点，ISO-8601 UTC；必须满足 to > from 且 to - from 不超过 7 天，否则返回 400 VALIDATION。
      schema:
        type: string
        format: date-time
      example: 2026-07-31T00:00:00Z
    MetricsTo:
      name: to
      in: query
      required: true
      description: 查询窗终点，ISO-8601 UTC；必须晚于 from，且与 from 的差不超过 7 天，否则返回 400 VALIDATION。
      schema:
        type: string
        format: date-time
      example: 2026-08-06T23:59:59Z
    MetricsUserId:
      name: user_id
      in: query
      required: false
      description: 可选的用户过滤条件，仍受调用者授权范围约束。
      schema:
        type: string
        minLength: 1
      example: u-agent-001
    MetricsPlatform:
      name: platform
      in: query
      required: false
      description: 按用户已确认的 canonical 平台过滤。
      schema:
        type: string
        enum:
          - qianniu
          - douyin
          - unknown
    MetricsHitStatus:
      name: hit_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/HitStatus"
    MetricsChosenRank:
      name: chosen_rank
      in: query
      required: false
      description: 按成功复制的候选位次过滤。
      schema:
        type: integer
        minimum: 1
        maximum: 3
    MetricsReleaseId:
      name: release_id
      in: query
      required: false
      description: 按搜索当时的不可变内容 release 过滤。
      schema:
        type: string
        minLength: 1
    StreamLimit:
      name: limit
      in: query
      required: false
      description: 每页条目数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    MetricsCursor:
      name: cursor
      in: query
      required: false
      description: 不透明 base64url cursor；内部为 created_at 与 query_id 的稳定倒序游标。
      schema:
        type: string
        minLength: 1
      example: MjAyNi0wOC0wNlQwMzoxNDoxNVp8NGQ2OTBlZjctYTk4ZC00YTU2LWE5YzQtOTJhZTRjNTIxNjhm
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 上次 current 响应的弱 ETag；命中时返回 304。
      schema:
        type: string
      example: W/"13"
    SnapshotClientId:
      name: X-Client-Id
      in: header
      required: true
      description: 当前客户端稳定 ID；租约同时绑定验签用户，不得跨客户端复用。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: mac-cs-001
    OptionalSnapshotLeaseToken:
      name: X-Snapshot-Lease
      in: header
      required: false
      description: |
        只用于 current 条件请求；仅当该 token 未过期且绑定同一 release/source hash
        时才允许 304，否则必须返回 200 并签发新短租约。
      schema:
        $ref: "#/components/schemas/OfflineSnapshotLeaseToken"
    RequiredSnapshotLeaseToken:
      name: X-Snapshot-Lease
      in: header
      required: true
      description: current 签发的不透明短租约；每一页都必须重新验证绑定与过期时间。
      schema:
        $ref: "#/components/schemas/OfflineSnapshotLeaseToken"
    ReleaseIdQuery:
      name: release_id
      in: query
      required: true
      description: 从 current 响应复制；同一次分页全过程不得省略或切换。
      schema:
        type: string
        minLength: 1
      example: rel-20260806-0013
    SnapshotLimit:
      name: limit
      in: query
      required: false
      description: 每页话术数。
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      example: 200
    SnapshotCursor:
      name: cursor
      in: query
      required: false
      description: 上一页最后一个 script_id；服务端按 script_id 升序继续。
      schema:
        type: string
        minLength: 1
      example: shipping-001
  headers:
    RetryAfter:
      description: 客户端重试前至少等待的秒数，最少为 1。
      schema:
        type: integer
        minimum: 1
      example: 1
    ETag:
      description: 由 release_seq 构成的弱 ETag。
      schema:
        type: string
        pattern: ^W/"[0-9]+"$
      example: W/"13"
    CacheControl:
      description: current 可缓存不超过 10 秒。
      schema:
        type: string
      example: max-age=10
    SnapshotLease:
      description: 304 仅回显请求中仍有效的原租约，不签发、不续期。
      schema:
        $ref: "#/components/schemas/OfflineSnapshotLeaseToken"
    SnapshotLeaseExpires:
      description: 原租约的固定过期时间；304 不得延长。
      schema:
        type: string
        format: date-time
  responses:
    ValidationError:
      description: 请求结构、字段或业务对应关系无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            validation:
              value:
                error:
                  code: VALIDATION
                  message: 请求参数不合法
                  details:
                    field: top_k
                    reason: must be between 1 and 3
    Unauthorized:
      description: 缺少或无法验证会话
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedErrorEnvelope"
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: 会话无效或已过期
    Forbidden:
      description: 当前已验签身份无权访问该资源或动作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenErrorEnvelope"
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: 当前角色无权执行此操作
    ForbiddenOrPolicyDenied:
      description: 当前身份越权，或动作违反一期策略
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenOrPolicyDeniedErrorEnvelope"
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: 当前身份无权访问该资源或执行此操作
            adoptionPolicyDenied:
              value:
                error:
                  code: POLICY_DENIED
                  message: adopted 只能通过 clipboard 或 autofill 完成
            phase1HardOff:
              value:
                error:
                  code: POLICY_DENIED
                  message: Phase 1 禁止启用 rewrite
                  details:
                    reason: PHASE1_HARD_OFF
                    flag_key: rewrite
                    requested_value: true
            nativeIntegrationDisabled:
              value:
                error:
                  code: POLICY_DENIED
                  message: Phase 1 未启用原生平台集成
                  details:
                    reason: NATIVE_INTEGRATION_DISABLED
                    platform_source: native_integration
            sourceSuspended:
              value:
                error:
                  code: POLICY_DENIED
                  message: 权威来源版本已暂停
                  details:
                    reason: SOURCE_SUSPENDED
                    source_version_id: srcv_presale_2026_08_09_01
            offlineLeaseExpired:
              value:
                error:
                  code: FORBIDDEN
                  message: 离线快照租约已过期，请联网刷新
                  details:
                    reason: OFFLINE_LEASE_EXPIRED
                    diagnostic_id: diag_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    NotFound:
      description: 指定资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: 指定资源不存在
    Conflict:
      description: 幂等键、状态机、发布锁或资源当前状态发生冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictErrorEnvelope"
          examples:
            idempotencyBodyMismatch:
              value:
                error:
                  code: CONFLICT
                  message: 幂等键已用于不同请求体
                  details:
                    reason: IDEMPOTENCY_BODY_MISMATCH
            inFlight:
              value:
                error:
                  code: CONFLICT
                  message: 同一幂等请求仍在处理中
                  details:
                    reason: IDEMPOTENCY_IN_FLIGHT
            sourceBaseReleaseStale:
              value:
                error:
                  code: CONFLICT
                  message: 导入基线已不是当前发布版本
                  details:
                    reason: SOURCE_BASE_RELEASE_STALE
    TooManyRequests:
      description: 令牌桶拒绝当前请求
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedErrorEnvelope"
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: 请求过于频繁，请稍后重试
                  details:
                    retry_after_sec: 2
    Overloaded:
      description: 连接池、并发槽或依赖存储暂时过载；生产限流存储故障也 fail-closed 到此响应
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OverloadedErrorEnvelope"
          examples:
            overloaded:
              value:
                error:
                  code: OVERLOADED
                  message: 服务暂时过载
                  details:
                    retry_after_sec: 1
    ServiceUnavailable:
      description: 路由或依赖过载，或 Owner 尚未完成首次内容发布
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/OverloadedErrorEnvelope"
              - $ref: "#/components/schemas/ContentNotReadyErrorEnvelope"
          examples:
            overloaded:
              value:
                error:
                  code: OVERLOADED
                  message: 服务暂时过载
                  details:
                    reason: DB_POOL_EXHAUSTED
                    retry_after_sec: 1
            firstReleasePending:
              value:
                error:
                  code: OVERLOADED
                  message: 内容尚未发布
                  details:
                    reason: CONTENT_NOT_READY
                    retry_after_sec: 1
            sourceGateNotReady:
              value:
                error:
                  code: OVERLOADED
                  message: 当前内容来源校验未通过
                  details:
                    reason: SOURCE_GATE_NOT_READY
                    retry_after_sec: 1
    InternalError:
      description: 未归类的服务端错误；不得泄露原始查询或内部堆栈
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
          examples:
            internal:
              value:
                error:
                  code: INTERNAL
                  message: 服务内部错误
  schemas:
    SopWorkbookUpload:
      type: object
      additionalProperties: false
      required:
        - file
