    IntakePrincipalPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - principalId
              - displayLabel
              - factsVersion
              - validUntil
              - enabled
            properties:
              principalId:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                minLength: 1
                maxLength: 128
              displayLabel:
                type: string
                minLength: 1
                maxLength: 256
              factsVersion:
                $ref: "#/components/schemas/IntakeVersion"
              validUntil:
                type: string
                format: date-time
                maxLength: 35
              enabled:
                type: boolean
        nextCursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
    IntakeContributorDeclaration:
      type: object
      additionalProperties: false
      required:
        - preparerPrincipalId
        - editorPrincipalIds
        - confirmed
      properties:
        preparerPrincipalId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        editorPrincipalIds:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            minLength: 1
            maxLength: 128
          minItems: 1
          maxItems: 98
          uniqueItems: true
        confirmed:
          type: boolean
          enum:
            - true
      description: 当前上传主体声明整理责任人及全部实际改稿人，纯本人制作也需显式列本人。服务端加入上传主体，按同租户/app已确认身份归一、校验并冻结入 contributors；这些是被声明贡献人，不能代替会话 actor 或赋予权限。声明变更须新候选版本。
    IntakeMaterialHeader:
      type: object
      additionalProperties: false
      required:
        - canonicalEncodingVersion
        - scope
        - sourceVersion
        - sourceClaim
        - templateVersion
        - ruleVersion
        - mappingVersion
        - selectedSheets
        - object
        - contributors
        - risk
        - baseReleaseId
        - media
      properties:
        canonicalEncodingVersion:
          type: string
          enum:
            - candidate-p1.1
        scope:
          $ref: "#/components/schemas/IntakeSourceScope"
        sourceVersion:
          $ref: "#/components/schemas/IntakeVersion"
        sourceClaim:
          $ref: "#/components/schemas/IntakeSourceClaim"
        templateVersion:
          type: string
          minLength: 1
          maxLength: 64
        ruleVersion:
          type: string
          minLength: 1
          maxLength: 64
        mappingVersion:
          type: string
          minLength: 1
          maxLength: 64
        selectedSheets:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 1
          maxItems: 16
        object:
          $ref: "#/components/schemas/IntakeObject"
        contributors:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            minLength: 1
            maxLength: 128
          minItems: 1
          maxItems: 100
        risk:
          $ref: "#/components/schemas/IntakeRisk"
        baseReleaseId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        media:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - objectId
              - sha256
              - mime
              - bytes
              - required
              - alt
            properties:
              objectId:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                minLength: 1
                maxLength: 128
              sha256:
                type: string
                pattern: ^[0-9a-f]{64}$
                minLength: 64
                maxLength: 64
              mime:
                type: string
                minLength: 1
                maxLength: 128
              bytes:
                $ref: "#/components/schemas/IntakeVersion"
              required:
                type: boolean
              alt:
                type: string
                minLength: 1
                maxLength: 1024
          minItems: 0
          maxItems: 0
      oneOf:
        - required:
            - templateVersion
            - ruleVersion
            - selectedSheets
          properties:
            templateVersion:
              const: faq-p1.1
            ruleVersion:
              const: intake-p1.1
            object:
              type: object
              properties:
                mime:
                  const: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            selectedSheets:
              const:
                - 来源
                - FAQ
                - 相似问法
        - required:
            - templateVersion
            - ruleVersion
            - selectedSheets
          properties:
            templateVersion:
              const: faq-csv-v1
            ruleVersion:
              const: intake-csv-v1
            mappingVersion:
              const: faq-csv-columns-v1
            object:
              type: object
              properties:
                mime:
                  const: text/csv
            selectedSheets:
              const:
                - CSV
    IntakeOperationReceipt:
      oneOf:
        - $ref: "#/components/schemas/IntakeReceipt"
        - $ref: "#/components/schemas/IntakeRollbackReceipt"
    IntakeRollbackReview:
      type: object
      additionalProperties: false
      required:
        - rollbackPlanId
        - reviewRequestId
        - evidenceVersion
        - state
        - instanceCode
        - revocationGeneration
        - checkedAt
        - validUntil
        - reviewPackageObjectId
        - reviewPackageSha256
        - impactDigest
      properties:
        rollbackPlanId:
          $ref: "#/components/schemas/IntakeId"
        reviewRequestId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        evidenceVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        state:
          type: string
          enum:
            - creating
            - pending
            - approved
            - rejected
            - revoked
            - unavailable
        instanceCode:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        revocationGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        checkedAt:
          type:
            - string
            - "null"
          format: date-time
          maxLength: 35
        validUntil:
          type:
            - string
            - "null"
          format: date-time
          maxLength: 35
        reviewPackageObjectId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        reviewPackageSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        impactDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
      description: 全目录回退的独立人工审核材料绑定和最长5分钟核验事实。unavailable 不续期，不可仅凭 approved 忽略 validUntil；提交仍由服务端重验。
      if:
        properties:
          state:
            const: approved
      then:
        properties:
          checkedAt:
            type: string
          validUntil:
            type: string
          instanceCode:
            type: string
          evidenceVersion:
            minimum: 1
            type: integer
    IntakeRollbackReviewRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - impactDigest
        - expectedEvidenceVersion
      properties:
        operationId:
          $ref: "#/components/schemas/IntakeId"
        impactDigest:
          $ref: "#/components/schemas/IntakeDigest"
        expectedEvidenceVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    IntakeRollbackReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - rollbackPlanId
        - state
        - releaseId
        - announcementId
        - reason
        - action
      properties:
        operationId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
            - pending
            - unknown
            - published
            - cancelled
            - failed
        releaseId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        announcementId:
          type:
            - string
