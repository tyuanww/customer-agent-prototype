    IntakeTermRef:
      type: object
      additionalProperties: false
      required:
        - id
        - displayVersion
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        displayVersion:
          $ref: "#/components/schemas/IntakeVersion"
    IntakeQuestion:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - text
        - active
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        version:
          $ref: "#/components/schemas/IntakeVersion"
        text:
          type: string
          minLength: 1
          maxLength: 4096
        active:
          type: boolean
    IntakeSourceClaim:
      type: object
      additionalProperties: false
      required:
        - versionKind
        - versionValue
        - acquisition
        - fileSha256
      properties:
        versionKind:
          type: string
          enum:
            - integer
            - opaque
            - unknown
        versionValue:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        acquisition:
          type: string
          enum:
            - feishu-export
            - controlled-synthetic-export
        fileSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
    IntakeCandidateKey:
      type: object
      additionalProperties: false
      required:
        - candidateId
        - version
        - digest
      properties:
        candidateId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        version:
          $ref: "#/components/schemas/IntakeVersion"
        digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
    IntakeReceive:
      type: object
      additionalProperties: false
      required:
        - operationId
        - objectId
        - sourceVersion
        - baseReleaseId
        - contributorDeclaration
        - expectedPriorKey
      properties:
        operationId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        objectId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        sourceVersion:
          $ref: "#/components/schemas/IntakeVersion"
        baseReleaseId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        contributorDeclaration:
          $ref: "#/components/schemas/IntakeContributorDeclaration"
        expectedPriorKey:
          oneOf:
            - $ref: "#/components/schemas/IntakeCandidateKey"
            - type: "null"
          description: 明确 null 为新建独立候选；完整旧键为修订该候选，不得从 source/file 推测。成功解析并复算后在同事务 CAS 旧键和可修订状态，废旧并冻结同 candidateId 的下一版。解析失败保留旧版；publishing/unknown/published/cancelled/invalidated 不允许修订，返回明确冲突。
    IntakeParseJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - generation
        - state
        - candidateId
        - candidateVersion
        - issues
        - totalIssues
        - excludedSheetCount
        - excludedMediaCount
        - reportObjectId
      properties:
        jobId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        generation:
          $ref: "#/components/schemas/IntakeVersion"
        state:
          type: string
          enum:
            - reading
            - parsing
            - validated
            - failed
            - cancelled
        candidateId:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minLength: 1
          maxLength: 128
        candidateVersion:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 9007199254740991
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IntakeIssue"
          minItems: 0
          maxItems: 100
        totalIssues:
          type: integer
