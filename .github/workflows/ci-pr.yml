name: PR fast gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: AI precheck
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verification-policy.mjs plan --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: node --test scripts/verification-policy.test.mjs
      - run: node scripts/check-documentation.mjs

  quick:
    needs: changes
    name: PR fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope passed the precheck; runtime checks are not required."
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.mode != 'docs'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode != 'docs'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode != 'docs'
        run: pnpm check:pr

  gate:
    name: PR fast gate
    if: always()
    needs: [changes, quick]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verification-policy.mjs gate-fast
