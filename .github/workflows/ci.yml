name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Verification scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/verification-policy.mjs plan --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: node --test scripts/verification-policy.test.mjs
      - run: node scripts/check-documentation.mjs

  quality:
    needs: changes
    name: Linux canonical check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope verified by Verification scope; runtime checks are not applicable."
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode == 'full'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm check
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @customer-agent/api test:search-decision

  postgres-15:
    needs: changes
    name: PostgreSQL 15 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope verified by Verification scope; runtime checks are not applicable."
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode == 'full'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode == 'full'
        name: Install PostgreSQL 15 binaries
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm test:db:integration
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @customer-agent/api test:integration
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @customer-agent/api test:e2e:backend
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm test:g1a:e0:ci

  windows-feasibility:
    needs: changes
    name: Windows feasibility smoke
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope verified by Verification scope; runtime checks are not applicable."
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode == 'full'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm package:win
      - if: needs.changes.outputs.mode == 'full'
        name: Smoke the desktop output just built by packaging
        run: pnpm --filter @customer-agent/desktop exec playwright test tests/e2e/smoke.spec.ts --grep @windows-feasibility
      - if: needs.changes.outputs.mode == 'full'
        name: State evidence boundary
        shell: pwsh
        run: |
          Write-Host "PASS: hosted Windows launch, shortcut registration, transparent-overlay runtime smoke, clean exit, and local-unsigned package postconditions."
          Write-Host "NOT PROVEN: enterprise device policy, IME, DPI, screen reader, signing, update, or Pilot readiness."

  gate:
    name: CI gate
    if: always()
    needs: [changes, quality, postgres-15, windows-feasibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verification-policy.mjs gate
