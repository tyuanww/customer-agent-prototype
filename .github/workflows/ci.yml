name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Verification scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: plan
        run: |
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "rules=true" >> "$GITHUB_OUTPUT"
          echo "Full verification is authoritative for main and manual runs."
      - run: node --test scripts/verification-policy.test.mjs
      - run: node scripts/check-documentation.mjs

  quality:
    needs: changes
    name: Linux canonical check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope verified by Verification scope; runtime checks are not applicable."
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode != 'docs'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode != 'docs'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode == 'desktop'
        run: pnpm check:desktop
      - if: needs.changes.outputs.mode == 'full'
        run: node scripts/check-migration-immutability.mjs
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm check
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @customer-agent/api test:search-decision

  postgres-15:
    needs: changes
    name: PostgreSQL 15 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mode != 'full'
        run: echo "This change scope does not require PostgreSQL integration."
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode == 'full'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode == 'full'
        name: Install PostgreSQL 15 binaries
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm test:db:integration
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm test:backup:integration
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @customer-agent/api test:integration
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm test:identity:integration
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm --filter @customer-agent/api test:e2e:backend
      - if: needs.changes.outputs.mode == 'full'
        run: pnpm test:g1a:e0:ci

  windows-feasibility:
    needs: changes
    name: Windows feasibility smoke
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope verified by Verification scope; runtime checks are not applicable."
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode != 'docs'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode != 'docs'
        name: Restore electron-builder cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}\electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - if: needs.changes.outputs.mode != 'docs'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode != 'docs'
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        # Main's full gate uses an empty diff to select every map-owned Windows check.
        run: node scripts/verification-policy.mjs run --base HEAD --head HEAD --lane windows
      - if: needs.changes.outputs.mode != 'docs'
        name: Upload UNSIGNED Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-local-unsigned
          path: release/local-unsigned/windows/*UNSIGNED*.exe
          if-no-files-found: error
          retention-days: 7
      - if: needs.changes.outputs.mode != 'docs'
        name: Smoke the desktop output just built by packaging
        run: pnpm --filter @customer-agent/desktop exec playwright test tests/e2e/smoke.spec.ts --grep @windows-feasibility
      - if: needs.changes.outputs.mode != 'docs'
        name: State evidence boundary
        shell: pwsh
        run: |
          Write-Host "PASS: hosted Windows launch, shortcut registration, transparent-overlay runtime smoke, clean exit, and local-unsigned package postconditions."
          Write-Host "NOT PROVEN: enterprise device policy, IME, DPI, screen reader, signing, update, or Pilot readiness."

  linux-feasibility:
    needs: changes
    name: Linux feasibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - if: needs.changes.outputs.mode == 'docs'
        run: echo "Documentation scope verified by Verification scope; runtime checks are not applicable."
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical keyword baseline provenance is verified against Git.
      - if: needs.changes.outputs.mode != 'docs'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.changes.outputs.mode != 'docs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.mode != 'docs'
        name: Restore electron-builder cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - if: needs.changes.outputs.mode != 'docs'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.mode != 'docs'
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: pnpm package:linux
      - if: needs.changes.outputs.mode != 'docs'
        name: Upload UNSIGNED Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-local-unsigned
          path: release/local-unsigned/linux/*UNSIGNED*.AppImage
          if-no-files-found: error
          retention-days: 7
      - if: needs.changes.outputs.mode != 'docs'
        name: Install Xvfb and Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          pnpm --filter @customer-agent/desktop exec playwright install-deps
      - if: needs.changes.outputs.mode != 'docs'
        name: Smoke electron-vite out/ from packaging (not the AppImage)
        run: xvfb-run --auto-servernum pnpm --filter @customer-agent/desktop exec playwright test tests/e2e/smoke.spec.ts --grep @linux-feasibility
      - if: needs.changes.outputs.mode != 'docs'
        name: State evidence boundary
        run: |
          echo "PASS: hosted Ubuntu UNSIGNED AppImage postconditions; overlay smoke launches packaging build out/main, not the AppImage."
          echo "NOT PROVEN: AppImage launch, IME, signing, update, Pilot, or product-remote login."

  gate:
    name: CI gate
    if: always()
    needs: [changes, quality, postgres-15, windows-feasibility, linux-feasibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verification-policy.mjs gate
