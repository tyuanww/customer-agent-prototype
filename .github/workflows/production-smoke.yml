name: Production smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Deployed API version to verify (x.y.z)
        required: true
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event_name }}-${{ inputs.expected_version }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/ops/production-smoke.test.mjs
      - name: Check production health
        if: github.event_name == 'schedule'
        run: node scripts/ops/production-smoke.mjs
      - name: Verify deployed release version
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/ops/production-smoke.mjs --expected-version "$EXPECTED_VERSION"
